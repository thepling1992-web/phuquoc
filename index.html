<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>푸꾸옥 포켓가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky slim header, one view at a time, bottom tab bar (지도·일정·옵션·번역·정보). Compact 13.5px UI. */
:root{--bg:#f2f7f7;--sf:#ffffff;--ink:#14282b;--mut:#587074;--ln:#d9e4e5;--ac:#0b6e7a;--acs:#dff1f3;--on-ac:#ffffff;
--sea:#d5e9ef;--land:#e4eedc;--coast:#8fb1a0;--warn:#fff3d6;--warnl:#e0b34a;--shadow:0 6px 24px rgba(10,40,45,.16);
--f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e191b;--sf:#162427;--ink:#e5f0f0;--mut:#93aaad;--ln:#294043;--ac:#4cc3d0;--acs:#173a40;--on-ac:#06191c;
--sea:#12303a;--land:#1d3326;--coast:#4d7a63;--warn:#3a3118;--warnl:#a98a2e;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e191b;--sf:#162427;--ink:#e5f0f0;--mut:#93aaad;--ln:#294043;--ac:#4cc3d0;--acs:#173a40;--on-ac:#06191c;
--sea:#12303a;--land:#1d3326;--coast:#4d7a63;--warn:#3a3118;--warnl:#a98a2e;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--f-ui);padding-block:0 76px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#wrap{max-width:760px;margin:0 auto}
#hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0 8px;border-bottom:1px solid var(--ln)}
#hd h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
#hd small{display:block;color:var(--mut);font-size:11.5px}
#hd .sp{flex:1;min-width:0}
.dd{font:500 12px var(--f-mono);background:var(--ac);color:var(--on-ac);border-radius:6px;padding:3px 7px;white-space:nowrap}
.ib{width:30px;height:30px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);display:grid;place-items:center;font-size:14px}
.days{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dtab{flex:0 0 auto;border:1px solid var(--ln);background:var(--sf);border-radius:9px;padding:5px 10px;text-align:left;min-width:64px}
.dtab b{display:block;font-size:12.5px}.dtab span{font-size:11px;color:var(--mut)}
.dtab[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.dtab[aria-pressed="true"] span{color:var(--on-ac);opacity:.85}
.sec{margin:10px 0 6px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec b{color:var(--ink);font-size:13.5px}
.mono{font-family:var(--f-mono)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.cf{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:3px 9px;font-size:12px}
.cf i,.dot{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:0 0 auto;display:inline-block}
.cf[aria-pressed="false"]{opacity:.45}
.cf[aria-pressed="true"]{border-color:var(--pc)}
.pre{border:1px solid var(--ln);background:var(--sf);border-radius:7px;padding:3px 9px;font-size:12px}
.pre[aria-pressed="true"]{background:var(--acs);border-color:var(--ac);color:var(--ac)}
#mapbox{position:relative;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--sea);touch-action:none}
#map{display:block;width:100%;height:min(62vh,560px);min-height:340px;cursor:grab;user-select:none}
#map:active{cursor:grabbing}
.zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zb button{width:30px;height:30px;border-radius:8px;background:var(--sf);border:1px solid var(--ln);font-size:16px;line-height:1}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:11px;padding:10px 12px;margin:8px 0}
.dh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.dh b{font-size:14px}
.pill{font-size:11px;color:var(--pc);border:1px solid var(--pc);border-radius:99px;padding:0 7px}
.vn{color:var(--mut);font-size:12px}.meta{color:var(--mut);font-size:11.5px;margin-top:1px}
.art{width:132px;float:right;margin:0 0 4px 10px;background:var(--acs);border-radius:9px;padding:4px}
.art svg{display:block;width:100%}
.card p{margin:5px 0}.tp{background:var(--warn);border-left:3px solid var(--warnl);padding:3px 8px;font-size:12px;border-radius:0 6px 6px 0}
.lk{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;clear:both}
.lk a,.lk button,.btn{border:1px solid var(--ln);border-radius:7px;padding:3px 9px;font-size:12px;color:var(--ac);text-decoration:none;background:var(--sf)}
.btn.p{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
ol.pl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.it{background:var(--sf);border:1px solid var(--ln);border-radius:11px;padding:8px 10px}
.r1{display:flex;align-items:center;gap:8px}
.tm{font:500 12px var(--f-mono);color:var(--ac);width:46px;flex:0 0 auto}
.tt{flex:1;min-width:0;text-align:left}.tt b{display:block;font-size:13.5px}.tt small{color:var(--mut);font-size:11.5px}
.alt{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:6px 0 0 54px}
.alt .lb{font-size:11px;color:var(--mut)}
.chip{border:1px dashed var(--pc);color:var(--ink);border-radius:99px;padding:1px 9px;font-size:12px;background:transparent}
.chip::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pc);margin-right:5px}
.chip[aria-pressed="true"]{background:var(--acs)}
.dt{margin:7px 0 0 54px;border-top:1px solid var(--ln);padding-top:6px;overflow:hidden}
.note{background:var(--warn);border:1px solid var(--warnl);border-radius:9px;padding:6px 10px;font-size:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.row .t{flex:1;min-width:0}.row b{font-size:13px}.row small{display:block;color:var(--mut);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{background:var(--sf);border:1px solid var(--ln);border-radius:11px;padding:0 8px}
.list>div:last-child .row{border-bottom:0}
.inl{padding:0 4px 8px;overflow:hidden}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:4px max(10px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px))}
#nav div{display:flex;width:100%;max-width:760px}
#nav button{flex:1;padding:6px 0;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--ac);font-weight:700}
#tip{position:fixed;z-index:40;width:250px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:11px;padding:9px 11px;box-shadow:var(--shadow);pointer-events:none;overflow:hidden}
#tip .art{width:104px}
#big{position:fixed;inset:0;z-index:60;background:var(--ac);color:var(--on-ac);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#big .v{font-size:clamp(28px,8vw,54px);font-weight:700;line-height:1.25;text-wrap:balance}
#big .k{font-size:15px;opacity:.9}
#toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:99px;font-size:12.5px;z-index:70;max-width:90vw;text-align:center}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;min-width:0}
.qrow{display:flex;gap:6px}.qrow input{flex:1}
.slot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.ph{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.ph:last-child{border-bottom:0}.ph .t{flex:1;min-width:0}.ph .v{color:var(--ac);font-weight:500}
.ph button{border:1px solid var(--ln);border-radius:7px;padding:2px 8px;font-size:12px;background:var(--sf)}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}
.chk input{width:16px;height:16px;accent-color:var(--ac)}
.tel{font:500 12.5px var(--f-mono);color:var(--ac)}
h3{font-size:13.5px;margin:14px 0 4px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div id="wrap">
  <header id="hd">
    <div class="sp"><h1>우리의 푸꾸옥</h1><small>11.07(토)–11.11(수) · 4박 5일 · 2명</small></div>

function hav(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

 h+='<div class="list">';L.forEach(q=>{h+='<div><button class="row" data-act="sp" data-id="'+q.id+'"><i class="dot" style="--pc:'+CAT[q.cat][1]+'"></i><span class="t"><b>'+esc(q.name)+'</b><small>'+q.area+' · '+esc(q.desc)+'</small></span></button>'+(S.spotOpen===q.id?'<div class="inl">'+det(q,true)+'</div>':'')+'</div>'});

 ['쇼핑',[['얼마예요?','Cái này bao nhiêu tiền?','얼마 가격'],['좀 깎아주세요','Giảm giá được không?','깎 할인'],['더 큰 사이즈 있나요?','Có cỡ lớn hơn không?','사이즈 옷 큰'],['입어봐도 되나요?','Tôi mặc thử được không?','입어 피팅 옷'],['카드 되나요?','Thanh toán bằng thẻ được không?','카드'],['영수증 주세요','Cho tôi hóa đơn.','영수증']]]];

 ['어디예요?','',' ở đâu?',[['화장실','Nhà vệ sinh'],['병원','Bệnh viện'],['약국','Hiệu thuốc'],['택시 타는 곳','Bến taxi'],['ATM','Cây ATM'],['호텔','Khách sạn']],''],
 ['빼주세요','Xin đừng cho ','',[['얼음','đá'],['고수','ngò'],['고추(매운 것)','ớt'],['생채소','rau sống'],['날달걀','trứng sống'],['설탕','đường']],'.']];
function vTalk(){let h='<div class="sec" style="margin-top:12px"><b>음성·문장 번역기</b><span>오프라인 문장 모음</span></div>';
 h+='<div class="card"><div class="qrow"><input type="text" id="q" placeholder="한국어로 말하거나 입력 (예: 화장실, 얼음)" aria-label="번역할 한국어"><button class="btn p" data-act="mic" aria-label="음성 입력">말하기</button></div><div class="lk" style="margin-top:6px"><button data-act="find">문장 찾기</button><button data-act="online">온라인 번역</button></div><div id="res"></div></div>';
 h+='<h3>빈칸 채우기</h3><div class="card">'+SL.map((s,i)=>'<div class="slot"><select id="sl'+i+'" aria-label="'+esc(s[0])+' 항목">'+s[3].map((a,j)=>'<option value="'+j+'">'+esc(a[0])+'</option>').join('')+'</select><b>'+esc(s[0])+'</b><button class="btn" data-act="slot" data-i="'+i+'">번역</button></div>').join('')+'<div id="slres"></div></div>';
 PH.forEach((g,gi)=>{h+='<h3>'+g[0]+'</h3><div class="card" style="padding:2px 12px">'+g[1].map((r,ri)=>'<div class="ph"><span class="t">'+esc(r[0])+'<br><span class="v">'+esc(r[1])+'</span></span><button data-act="say" data-t="'+esc(r[1])+'">읽기</button><button data-act="big" data-k="'+esc(r[0])+'" data-t="'+esc(r[1])+'">크게</button></div>').join('')+'</div>'});
 return h+'<p class="vn">"읽기"는 기기의 베트남어 음성을 사용합니다. 음성이 없으면 "크게"로 상대방에게 보여주세요. 마이크 입력과 온라인 번역은 이 파일을 브라우저에서 직접 열었을 때 동작할 수 있고, 공유 페이지에서는 막힐 수 있습니다.</p>'}
function phraseRow(r){return '<div class="ph"><span class="t">'+esc(r[0])+'<br><span class="v">'+esc(r[1])+'</span></span><button data-act="say" data-t="'+esc(r[1])+'">읽기</button><button data-act="big" data-k="'+esc(r[0])+'" data-t="'+esc(r[1])+'">크게</button></div>'}
const HOSP=['vinmec','vinmecdd','sunhosp'];
const CHK=['영문 소견서 (항공사 규정 확인)','산모수첩·초음파 사진 영문 정리','여행자보험 증서 (임신 합병증 보장 확인)','모기 기피제·밝은 색 긴팔','선크림·챙 넓은 모자','담당의 승인 상비약·체온계','압박스타킹·편한 신발','병원 3곳 지도 핀 저장','텀블러·간식·전해질','eSIM·그랩 앱·소액 현금'];
function vInfo(){let h='<div class="sec" style="margin-top:12px"><b>응급·준비 정보</b></div>';
 HOSP.forEach(id=>{h+='<div class="card">'+det(P[id],true)+'</div>'});
 h+='<div class="card"><b>비상 연락</b><div class="chk"><span>외교부 영사콜센터(24시간)</span><span class="tel">+82-2-3210-0404</span></div><div class="chk"><span>베트남 구급차(일반 정보, 호텔 통해 호출 권장)</span><span class="tel">115</span></div></div>';
 h+='<div class="card"><b>바로 병원: </b>질 출혈·양수 의심 · 규칙적 복통 · 38℃ 이상 발열과 발진 · 심한 두통·시야 이상 · 한쪽 다리 부종 · 태동 감소 · 반복 구토로 물을 못 마심</div>';
 h+='<h3>출발 전 체크</h3><div class="card">'+CHK.map((c,i)=>'<label class="chk"><input type="checkbox" data-act="chk" data-i="'+i+'"'+(S.chk[i]?' checked':'')+'>'+esc(c)+'</label>').join('')+'</div>';
 h+='<p class="vn">좌표·시간·병원 정보는 웹 자료와 개략 계산 기준이라 출발 전에 다시 확인하세요. 의학 내용은 담당의와 상의하세요. 뎅기열은 국내 허가 백신이 없어 모기 예방이 핵심입니다.</p>';return h}

function render(){const v=S.view,a=$('#app');a.innerHTML=({map:vMap,plan:vPlan,spots:vSpots,talk:vTalk,info:vInfo}[v]||vPlan)();
 document.querySelectorAll('#nav button').forEach(b=>{if(b.dataset.v===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 if(v==='map'){bindMap();if(!S.vb)S.vb=fit(dayPts(),.18);requestAnimationFrame(()=>{if(S.pre==null||S.pre==='route'){S.vb=fit(dayPts(),.18);S.pre='route'}drawMap();syncPre()})}
 hideTip()}
function go(v){S.view=v;try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}render();window.scrollTo(0,0)}

/* ---------- translator ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},2600)}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().indexOf('vi')===0);if(v)u.voice=v;else toast('기기에 베트남어 음성이 없을 수 있어요. "크게"로 보여주세요');speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('이 환경에서는 음성 재생을 쓸 수 없어요. "크게"를 이용하세요')}}
function big(k,t){const b=$('#big');b.innerHTML='<div class="k">'+esc(k)+'</div><div class="v">'+esc(t)+'</div><div class="k">화면을 누르면 닫혀요</div>';b.hidden=false}
function findPh(){const q=($('#q').value||'').trim();const all=[];PH.forEach(g=>g[1].forEach(r=>all.push(r)));
 const m=q?all.filter(r=>(r[0]+' '+r[2]).indexOf(q)>-1||q.split(/\s+/).some(w=>w.length>0&&(r[0]+' '+r[2]).indexOf(w)>-1)):all.slice(0,6);
 $('#res').innerHTML=m.length?m.map(phraseRow).join(''):'<p class="vn">맞는 문장이 없어요. "온라인 번역"을 눌러 보거나 아래 문장 모음을 확인하세요.</p>'}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('이 환경은 음성 인식을 지원하지 않아요. 키보드의 마이크 버튼으로 말해 보세요');$('#q').focus();return}
 try{const r=new R();r.lang='ko-KR';r.onresult=e=>{$('#q').value=e.results[0][0].transcript;findPh()};r.onerror=()=>toast('마이크를 쓸 수 없어요. 키보드의 마이크 버튼을 이용해 주세요');r.start();toast('듣는 중…')}catch(e){toast('음성 입력을 시작하지 못했어요');$('#q').focus()}}
async function online(){const t=($('#q').value||'').trim();if(!t){toast('번역할 문장을 입력하세요');return}
 try{const c=new AbortController();setTimeout(()=>c.abort(),6000);const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair=ko|vi',{signal:c.signal});const j=await r.json();const v=j&&j.responseData&&j.responseData.translatedText;if(!v)throw 0;$('#res').innerHTML=phraseRow([t,v])}
 catch(e){$('#res').innerHTML='<p class="vn">이 화면에서는 온라인 번역에 연결할 수 없어요. "문장 찾기"나 아래 문장 모음을 이용하세요.</p>'}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b){const bg=e.target.closest('#big');if(bg)bg.hidden=true;return}
 const a=b.dataset.act,k=b.dataset.k,i=+b.dataset.i;
 if(a==='day'){S.day=i;store.set('day',i);S.open={};S.prev={};S.pre='route';render()}
 else if(a==='open'){S.open[k]=!S.open[k];render()}
 else if(a==='prev'){S.prev[k]=(S.prev[k]===i)?null:i;if(S.prev[k]==null)delete S.prev[k];render()}
 else if(a==='swap'){S.sel[k]=i;store.set('sel',S.sel);delete S.prev[k];render();toast('교체했어요. 이동거리를 다시 계산했습니다')}
 else if(a==='route'){S.pre='route';go('map')}
 else if(a==='pre'){setPreset(k)}
 else if(a==='cat'){if(S.cats.has(k))S.cats.delete(k);else S.cats.add(k);b.setAttribute('aria-pressed',S.cats.has(k));drawMap()}
 else if(a==='zin'){const v=S.vb;zoom(.7,v.x+v.w/2,v.y+v.h/2)}
 else if(a==='zout'){const v=S.vb;zoom(1.4,v.x+v.w/2,v.y+v.h/2)}
 else if(a==='onmap'){S.pick=b.dataset.id;S.view='map';S.pre='';const q=P[S.pick];S.vb=fit([q],.2);S.vb.w=Math.max(S.vb.w,80);go('map');}
 else if(a==='spot'){S.spot=k;S.spotOpen=null;render()}
 else if(a==='sp'){S.spotOpen=S.spotOpen===b.dataset.id?null:b.dataset.id;render()}
 else if(a==='mic')mic();else if(a==='find')findPh();else if(a==='online')online();
 else if(a==='slot'){const s=SL[i],j=+$('#sl'+i).value,it=s[3][j],vi=s[1]+it[1]+s[2]+s[4];$('#slres').innerHTML=phraseRow([it[0]+' '+s[0],vi.replace(/\s+\./,'.').replace(/\s+\?/,'?')])}
 else if(a==='say')speak(b.dataset.t);else if(a==='big')big(b.dataset.k,b.dataset.t)});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.act==='chk'){S.chk[e.target.dataset.i]=e.target.checked;store.set('chk',S.chk)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#big').hidden=true;if(e.key==='Enter'&&e.target.id==='q')findPh()});
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-id]');if(!t||t.closest('svg'))return;const pl=P[t.dataset.id];if(pl&&(t.matches('.row,.tt,.chip')))showTip(pl,e)});
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-id]');if(t&&!t.closest('svg')&&t.matches('.row,.tt,.chip'))moveTip(e);else if(!e.target.closest('svg'))hideTip()});

(function(){const n=$('#nav div');n.innerHTML=VIEWS.map(v=>'<button data-v="'+v[0]+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+v[2]+'</svg>'+v[1]+'</button>').join('');
 n.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.v==='map')S.pre='route';go(b.dataset.v)}});
 const t=new Date(2026,10,7),now=new Date(),dd=Math.ceil((t-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
 $('#dd').textContent=dd>0?'D-'+dd:(dd>-5?'여행 중':'다녀옴');
 $('#th').addEventListener('click',()=>{const r=document.documentElement,d=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',d==='dark'?'light':'dark');if(S.view==='map')drawMap()});
 window.addEventListener('resize',()=>{if(S.view==='map'&&S.vb)drawMap()});
 window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==S.view){S.view=h;render()}});
 const h=location.hash.slice(1);S.view=VIEWS.some(v=>v[0]===h)?h:'plan';render()})();
})();
